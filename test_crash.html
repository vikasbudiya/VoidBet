<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Crash - Standalone Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #08090d; color: #fff; font-family: 'Space Grotesk', sans-serif; }
        
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0,240,255,0.4);
        }
        
        .game-frame {
            position: relative;
            width: 100%;
            height: 500px;
            background: #090a0f;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0,240,255,0.15);
        }
        
        #crashCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        
        .crash-live-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        
        .crash-multiplier-display {
            font-size: 72px;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0,240,255,0.4);
        }
        
        #crashBotFeed {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            z-index: 10;
            max-height: 90px;
            overflow: hidden;
        }
        
        .bot-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,240,255,0.2);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .btn-bet {
            background: linear-gradient(135deg, #00f0ff, #00b4d8);
            color: #000;
        }
        
        .btn-cashout {
            background: linear-gradient(135deg, #ff007a, #bd00ff);
            color: #fff;
        }
        
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        
        #crashCountdownOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 12;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Rocket Crash - Standalone Test</h1>
        
        <div class="game-frame" id="gameViewportFrame">
            <canvas id="crashCanvas" width="800" height="500"></canvas>
            <div class="crash-live-indicator">
                <div class="crash-multiplier-display" id="crashLiveMult">LOADING...</div>
                <div style="font-size: 11px; font-weight:700; letter-spacing:0.15em; color: rgba(255,255,255,0.5);" id="crashLiveSub">GAME STARTING...</div>
            </div>
            <div id="crashCountdownOverlay">
                <div id="crashCountdownNum" style="font-size:72px;font-weight:700;color:#00f0ff;text-shadow:0 0 30px rgba(0,240,255,0.6);display:none;"></div>
                <div id="crashCountdownLabel" style="font-size:13px;font-weight:600;letter-spacing:0.2em;color:rgba(255,255,255,0.5);margin-top:8px;display:none;">PLACE YOUR BETS</div>
            </div>
            <div id="crashBotFeed"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-bet" id="gameActionTriggerBtn">⚡ PLACE BET</button>
        </div>
        
        <div class="status" id="statusText">Click anywhere to start audio. Game auto-starts in 1.5 seconds.</div>
    </div>

    <script>
        // === MINI STANDALONE CRASH ENGINE ===
        // This is a self-contained version for testing
        
        const canvas = document.getElementById("crashCanvas");
        const ctx = canvas.getContext("2d");
        const multDisplay = document.getElementById("crashLiveMult");
        const subDisplay = document.getElementById("crashLiveSub");
        const countdownNumEl = document.getElementById("crashCountdownNum");
        const countdownLabelEl = document.getElementById("crashCountdownLabel");
        const botFeedEl = document.getElementById("crashBotFeed");
        const actionBtn = document.getElementById("gameActionTriggerBtn");
        const statusText = document.getElementById("statusText");
        
        // Canvas fixed buffer
        canvas.width = 800;
        canvas.height = 500;
        
        // State
        let phase = "idle";
        let mult = 1.00;
        let crashAt = 2.00;
        let flyFrames = 0;
        let countSec = 10;
        let countInterval = null;
        let round = 0;
        let tick = 0;
        let animId = null;
        let dead = false;
        let shake = 0;
        let trails = [];
        let explosionParts = [];
        let bots = [];
        let pBet = false;
        let pCashed = false;
        let pAutoCash = 2.0;
        
        const BOT_NAMES = ["CryptoKing", "NeonRider", "VoidHunter", "MoonShot", "DiamondHands", "SatoshiBot", "GigaWhale", "RocketFuel", "LunarWolf", "CyberPunk", "DegenApe", "FlashBet", "MegaBull", "NightOwl", "PixelPro"];
        
        // Debris
        const debris = Array.from({length: 12}, () => ({
            x: Math.random() * 800,
            y: Math.random() * 500,
            r: 2 + Math.random() * 4,
            sp: 0.3 + Math.random() * 0.8,
            rot: Math.random() * Math.PI * 2,
            rs: (Math.random() - 0.5) * 0.03,
            col: ["rgba(0,240,255,0.15)", "rgba(189,0,255,0.12)", "rgba(255,0,122,0.1)"][Math.floor(Math.random() * 3)]
        }));
        
        const pickCrash = () => {
            const r = Math.random();
            if (r < 0.03) return 1.00;
            if (r < 0.10) return 1.01 + Math.random() * 0.3;
            if (r < 0.45) return 1.3 + Math.random() * 1.5;
            if (r < 0.75) return 2.0 + Math.random() * 3.0;
            if (r < 0.92) return 4.0 + Math.random() * 5.0;
            return 8.0 + Math.random() * 15.0;
        };
        
        const genBots = () => {
            const count = 5 + Math.floor(Math.random() * 6);
            bots = [];
            const used = new Set();
            for (let i = 0; i < count; i++) {
                let name;
                do { name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)]; } while (used.has(name));
                used.add(name);
                bots.push({
                    name,
                    bet: (0.001 + Math.random() * 0.5).toFixed(3),
                    cashAt: 1.2 + Math.random() * (crashAt - 1.0) * 0.85,
                    cashed: false
                });
            }
        };
        
        const doBotCashouts = () => {
            bots.forEach(b => {
                if (!b.cashed && mult >= b.cashAt) {
                    b.cashed = true;
                    const win = (parseFloat(b.bet) * b.cashAt).toFixed(3);
                    const tag = document.createElement("div");
                    tag.className = "bot-tag";
                    tag.style.color = "#00ff88";
                    tag.style.borderColor = "rgba(0,255,136,0.3)";
                    tag.innerHTML = `🤖 ${b.name} cashed <b>${b.cashAt.toFixed(2)}x</b> → +${win}`;
                    botFeedEl.appendChild(tag);
                }
            });
        };
        
        // === PHASES ===
        const goCountdown = () => {
            phase = "countdown";
            round++;
            countSec = 10;
            mult = 1.00;
            flyFrames = 0;
            crashAt = pickCrash();
            
            multDisplay.textContent = "STARTING...";
            multDisplay.style.color = "#00f0ff";
            multDisplay.style.textShadow = "0 0 15px rgba(0,240,255,0.4)";
            multDisplay.classList.remove("crashed");
            subDisplay.textContent = `ROUND #${round} — PLACE YOUR BETS`;
            
            countdownNumEl.textContent = countSec + "s";
            countdownNumEl.style.display = "block";
            countdownLabelEl.style.display = "block";
            
            genBots();
            botFeedEl.innerHTML = "";
            bots.forEach(b => {
                const tag = document.createElement("div");
                tag.className = "bot-tag";
                tag.innerHTML = `🤖 ${b.name}: ${b.bet} ETH`;
                botFeedEl.appendChild(tag);
            });
            
            actionBtn.textContent = "⚡ PLACE BET";
            actionBtn.disabled = false;
            statusText.textContent = `Round #${round} | Crash target: ${crashAt.toFixed(2)}x (debug)`;
            
            clearInterval(countInterval);
            countInterval = setInterval(() => {
                countSec--;
                if (countSec <= 0) {
                    clearInterval(countInterval);
                    goFly();
                } else {
                    countdownNumEl.textContent = countSec + "s";
                }
            }, 1000);
        };
        
        const goFly = () => {
            phase = "flying";
            flyFrames = 0;
            mult = 1.00;
            trails = [];
            
            countdownNumEl.style.display = "none";
            countdownLabelEl.style.display = "none";
            subDisplay.textContent = "ROCKET IS FLYING — CASH OUT NOW!";
            
            actionBtn.textContent = "💰 CASH OUT";
            statusText.textContent = `Round #${round} | FLYING! Crash at ${crashAt.toFixed(2)}x`;
        };
        
        const goCrash = () => {
            phase = "crashed";
            shake = 30;
            
            multDisplay.textContent = crashAt.toFixed(2) + "x";
            multDisplay.style.color = "#ff007a";
            multDisplay.style.textShadow = "0 0 30px rgba(255,0,122,0.6)";
            multDisplay.classList.add("crashed");
            subDisplay.textContent = "CRASHED! 💥";
            
            const launchX = 100;
            const launchY = canvas.height - 80;
            const t = Math.min(flyFrames / 400, 1.0);
            const crashX = launchX + t * (canvas.width - 200);
            const crashY = launchY - Math.pow(t, 0.7) * (canvas.height - 120);
            
            // Explosion particles
            for (let i = 0; i < 120; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 8;
                explosionParts.push({
                    x: crashX,
                    y: crashY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    r: 3 + Math.random() * 8,
                    life: 1.0,
                    decay: 0.008 + Math.random() * 0.015,
                    col: ["#ff007a", "#bd00ff", "#00f0ff", "#ff8c00", "#ffff00", "#ff4444"][Math.floor(Math.random() * 6)]
                });
            }
            
            actionBtn.textContent = "WAITING...";
            actionBtn.disabled = true;
            statusText.textContent = `Round #${round} CRASHED at ${crashAt.toFixed(2)}x! Next round in 3s...`;
            
            setTimeout(() => {
                if (!dead) goCountdown();
            }, 3000);
        };
        
        // Button handler
        actionBtn.addEventListener("click", () => {
            if (phase === "countdown" && !pBet) {
                pBet = true;
                pCashed = false;
                actionBtn.textContent = "BET PLACED ✓";
                actionBtn.disabled = true;
            } else if (phase === "flying" && pBet && !pCashed) {
                pCashed = true;
                const win = (0.01 * mult).toFixed(4);
                actionBtn.textContent = `CASHED ${mult.toFixed(2)}x! +${win}`;
                actionBtn.disabled = true;
            }
        });
        
        // === RENDER LOOP ===
        const render = () => {
            if (dead) return;
            tick++;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#08090d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Screen shake
            let sx = 0, sy = 0;
            if (shake > 0) {
                sx = (Math.random() - 0.5) * shake;
                sy = (Math.random() - 0.5) * shake;
                shake *= 0.92;
            } else if (phase === "flying") {
                const rumble = Math.min(5, (mult - 1.0) * 0.8);
                sx = (Math.random() - 0.5) * rumble;
                sy = (Math.random() - 0.5) * rumble;
            }
            ctx.save();
            ctx.translate(sx, sy);
            
            // Stars
            for (let i = 0; i < 80; i++) {
                const starX = (Math.sin(i * 123.4 + i * 0.7) * 0.5 + 0.5) * canvas.width;
                const starY = ((i * 19) % canvas.height + (phase === "flying" ? flyFrames * (1.5 + mult * 2) * 0.5 : tick * 0.3)) % canvas.height;
                const bright = 0.2 + Math.sin(tick * 0.02 + i) * 0.15;
                ctx.fillStyle = `rgba(255,255,255,${bright})`;
                const sz = i % 5 === 0 ? 3 : i % 3 === 0 ? 2 : 1;
                ctx.fillRect(starX, starY, sz, sz);
            }
            
            // Space debris
            debris.forEach(d => {
                d.y = (d.y + d.sp * (phase === "flying" ? 1 + mult * 2 : 0.5)) % canvas.height;
                d.rot += d.rs;
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rot);
                ctx.fillStyle = d.col;
                ctx.fillRect(-d.r / 2, -d.r / 2, d.r, d.r);
                ctx.restore();
            });
            
            // Nebula
            if (mult >= 2.0 && phase === "flying") {
                const g = ctx.createRadialGradient(canvas.width * 0.7, canvas.height * 0.3, 10, canvas.width * 0.7, canvas.height * 0.3, 200);
                g.addColorStop(0, `rgba(189,0,255,${0.08 + Math.sin(tick * 0.03) * 0.04})`);
                g.addColorStop(0.5, "rgba(0,240,255,0.04)");
                g.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Rocket position
            const launchX = 100;
            const launchY = canvas.height - 80;
            let rocketX, rocketY;
            if (phase === "flying" || phase === "crashed") {
                const t = Math.min(flyFrames / 400, 1.0);
                rocketX = launchX + t * (canvas.width - 200);
                rocketY = launchY - Math.pow(t, 0.7) * (canvas.height - 120);
            } else {
                rocketX = launchX;
                rocketY = launchY;
            }
            
            // Flying logic
            if (phase === "flying") {
                flyFrames++;
                mult = Math.pow(Math.E, flyFrames * 0.005);
                multDisplay.textContent = mult.toFixed(2) + "x";
                
                if (mult >= 5.0) {
                    multDisplay.style.color = "#ff007a";
                    multDisplay.style.textShadow = "0 0 30px rgba(255,0,122,0.6)";
                } else if (mult >= 2.0) {
                    multDisplay.style.color = "#00ff88";
                    multDisplay.style.textShadow = "0 0 20px rgba(0,255,136,0.4)";
                } else {
                    multDisplay.style.color = "#00f0ff";
                    multDisplay.style.textShadow = "0 0 15px rgba(0,240,255,0.4)";
                }
                
                // Thruster trails
                if (flyFrames % 2 === 0) {
                    for (let t = 0; t < 4; t++) {
                        trails.push({
                            x: rocketX + (Math.random() - 0.5) * 14,
                            y: rocketY + 20 + Math.random() * 10,
                            r: 8 + Math.random() * 14,
                            vx: (Math.random() - 0.5) * 4,
                            vy: 2 + Math.random() * 4,
                            life: 1.0,
                            col: t === 0 ? "rgba(255,200,0,0.9)" : t === 1 ? "rgba(255,0,122,0.7)" : t === 2 ? "rgba(189,0,255,0.5)" : "rgba(255,120,0,0.6)"
                        });
                    }
                }
                
                doBotCashouts();
                
                if (mult >= crashAt) {
                    goCrash();
                }
            }
            
            // Draw trails
            trails.forEach(t => {
                t.x += t.vx; t.y += t.vy; t.life -= 0.025;
                if (t.life > 0) {
                    ctx.save();
                    ctx.globalAlpha = t.life;
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * t.life, 0, Math.PI * 2);
                    ctx.fillStyle = t.col; ctx.shadowColor = t.col; ctx.shadowBlur = 15;
                    ctx.fill(); ctx.restore();
                }
            });
            trails = trails.filter(t => t.life > 0);
            
            // Flight path
            if (phase === "flying") {
                ctx.save();
                ctx.strokeStyle = "rgba(0,240,255,0.3)";
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.moveTo(launchX, launchY);
                for (let step = 0; step <= Math.min(flyFrames / 400, 1.0); step += 0.02) {
                    const px = launchX + step * (canvas.width - 200);
                    const py = launchY - Math.pow(step, 0.7) * (canvas.height - 120);
                    ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.restore();
            }
            
            // Launch pad
            if (phase === "countdown" || phase === "idle") {
                ctx.save();
                ctx.fillStyle = "rgba(0,240,255,0.15)";
                ctx.fillRect(launchX - 30, launchY + 25, 60, 6);
                ctx.fillRect(launchX - 20, launchY + 18, 40, 8);
                ctx.fillStyle = "rgba(0,240,255,0.08)";
                ctx.fillRect(launchX + 28, launchY - 40, 4, 65);
                ctx.fillRect(launchX + 24, launchY - 45, 12, 6);
                ctx.restore();
            }
            
            // === DRAW ROCKET ===
            if (phase === "countdown" || phase === "flying") {
                ctx.save();
                ctx.translate(rocketX, rocketY);
                const angle = phase === "flying" ? -0.5 - Math.min(flyFrames * 0.001, 0.3) : 0;
                ctx.rotate(angle);
                
                ctx.shadowColor = phase === "flying" ? "#ff007a" : "#00f0ff";
                ctx.shadowBlur = phase === "flying" ? 30 + Math.sin(tick * 0.15) * 15 : 20;
                
                // Body
                const bodyGrad = ctx.createLinearGradient(0, -35, 0, 25);
                bodyGrad.addColorStop(0, "#ffffff");
                bodyGrad.addColorStop(0.3, "#e0e5f0");
                bodyGrad.addColorStop(1, "#b0b8cc");
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(0, -35);
                ctx.lineTo(-14, 20);
                ctx.lineTo(14, 20);
                ctx.closePath();
                ctx.fill();
                
                // Nose
                const noseGrad = ctx.createLinearGradient(0, -35, 0, -10);
                noseGrad.addColorStop(0, "#ff007a");
                noseGrad.addColorStop(1, "#bd00ff");
                ctx.fillStyle = noseGrad;
                ctx.beginPath();
                ctx.moveTo(0, -35);
                ctx.lineTo(-8, -10);
                ctx.lineTo(8, -10);
                ctx.closePath();
                ctx.fill();
                
                // Fins
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.moveTo(-14, 20); ctx.lineTo(-24, 30); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(14, 20); ctx.lineTo(24, 30); ctx.lineTo(10, 12); ctx.closePath(); ctx.fill();
                
                // Window
                ctx.fillStyle = "#00f0ff";
                ctx.shadowColor = "#00f0ff"; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                
                // Stripe
                ctx.fillStyle = "#ff007a";
                ctx.fillRect(-10, 8, 20, 3);
                
                // Fire
                if (phase === "flying") {
                    for (let f = 0; f < 7; f++) {
                        const flameLen = 20 + Math.random() * 30 + mult * 4;
                        const flameW = 4 + Math.random() * 7;
                        const colors = ["rgba(255,200,0,0.9)", "rgba(255,120,0,0.8)", "rgba(255,0,122,0.6)", "rgba(189,0,255,0.4)", "rgba(255,255,200,0.7)"];
                        ctx.fillStyle = colors[f % colors.length];
                        ctx.beginPath();
                        ctx.moveTo(-flameW + (Math.random() - 0.5) * 6, 20);
                        ctx.lineTo(flameW + (Math.random() - 0.5) * 6, 20);
                        ctx.lineTo((Math.random() - 0.5) * 8, 20 + flameLen);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                
                ctx.restore();
            }
            
            // Explosion
            if (phase === "crashed") {
                explosionParts.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    p.vx *= 0.97; p.vy *= 0.97;
                    if (p.life > 0) {
                        ctx.save();
                        ctx.globalAlpha = p.life;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                        ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 18;
                        ctx.fill(); ctx.restore();
                    }
                });
                explosionParts = explosionParts.filter(p => p.life > 0);
                
                ctx.save();
                ctx.font = "bold 42px 'Space Grotesk', sans-serif";
                ctx.fillStyle = "#ff007a";
                ctx.shadowColor = "#ff007a"; ctx.shadowBlur = 30;
                ctx.textAlign = "center";
                ctx.fillText("💥 BOOM!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "bold 22px 'Space Grotesk', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 0;
                ctx.fillText(`Crashed at ${crashAt.toFixed(2)}x`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.restore();
            }
            
            // Debug text
            ctx.save();
            ctx.font = "bold 12px 'Space Grotesk', monospace";
            ctx.fillStyle = "rgba(0,240,255,0.6)";
            ctx.textAlign = "left";
            ctx.fillText(`Phase: ${phase} | Round: ${round} | Mult: ${mult.toFixed(2)}x | Crash@: ${crashAt.toFixed(2)}x | FlyFrames: ${flyFrames}`, 10, 18);
            ctx.restore();
            
            ctx.restore(); // end shake
            
            animId = requestAnimationFrame(render);
        };
        
        // === START ===
        render();
        setTimeout(() => {
            if (!dead) goCountdown();
        }, 1500);
        
        console.log("🚀 Rocket Crash standalone test started. Game auto-starts in 1.5s.");
    </script>
</body>
</html>
